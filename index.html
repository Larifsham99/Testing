<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Simple</title>
  <!-- Link ke manifest untuk jadikan ia installable -->
  <link rel="manifest" href="manifest.json">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col items-center justify-center">
  
  <div class="bg-white p-8 rounded-2xl shadow-lg text-center max-w-sm w-full">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Cuba Apps! 🚀</h1>
    <p class="text-gray-500 mb-6">Apps simple dari GitHub Pages.</p>
    
    <button id="btn-klik" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg w-full transition-all active:scale-95">
      Tekan Saya
    </button>
    
    <p id="mesej" class="mt-4 text-green-600 font-medium h-6"></p>
  </div>

  <script>
    // Logik Butang
    document.getElementById('btn-klik').addEventListener('click', () => {
      document.getElementById('mesej').innerText = 'Berjaya! Apps berfungsi.';
    });

    // Wajib untuk PWA: Daftarkan Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Berdaftar!', reg))
          .catch(err => console.log('Service Worker Gagal:', err));
      });
    }
  </script>
</body>
</html>
